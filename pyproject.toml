[project]
name = "web-check-mcp"
version = "0.3.0"
description = "MCP + CLI agent wrapper for Lissy93 Web Check OSINT API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AMEOBIUS" }]
keywords = ["mcp", "web-check", "osint", "security", "agents"]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "mypy>=1.0",
    "ruff>=0.1",
    "black>=23.0",
]


[project.scripts]
web-check-mcp = "src.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-data]
src = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# BLE001 disabled: intentional catch-all Exception in API/MCP handlers
# to surface structured errors to the agent instead of crashing.
ignore = ["BLE001"]
