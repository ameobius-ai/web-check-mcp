name: One-shot Type Repair Diagnostics

on:
  push:
    branches:
      - style/ruff-format-pass

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: style/ruff-format-pass
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Capture every repair stage
        run: |
          set +e
          {
            echo "== asserted patch =="
            python - <<'PY'
          from pathlib import Path

          path = Path("src/client.py")
          text = path.read_text()
          replacements = [
              (
                  "        self._last_failure_time = 0\n        self._last_success_time = 0",
                  "        self._last_failure_time: float = 0.0\n        self._last_success_time: float = 0.0",
              ),
              (
                  "        self._last_failure_time = 0\n\n\nclass RateLimiter:",
                  "        self._last_failure_time = 0.0\n\n\nclass RateLimiter:",
              ),
              (
                  "        self.tokens = bucket_size",
                  "        self.tokens: float = float(bucket_size)",
              ),
              (
                  "        self._cache: dict[str, tuple[float, Any]] = {}",
                  "        self._cache: dict[str, tuple[float, dict[str, Any]]] = {}",
              ),
              (
                  "    def get(self, url: str, check: str) -> Any | None:",
                  "    def get(self, url: str, check: str) -> dict[str, Any] | None:",
              ),
              (
                  "    def set(self, url: str, check: str, data: Any):",
                  "    def set(self, url: str, check: str, data: dict[str, Any]) -> None:",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              print(f"matches={count}: {old!r}")
              if count != 1:
                  raise SystemExit(f"expected exactly one match, got {count}")
              text = text.replace(old, new)
          path.write_text(text)

          ci_path = Path(".github/workflows/ci.yml")
          ci = ci_path.read_text()
          old = "          pip install ruff==0.16.2 mypy"
          new = "          pip install ruff==0.16.2 mypy==2.3.0"
          count = ci.count(old)
          print(f"CI pin matches={count}")
          if count != 1:
              raise SystemExit(f"expected exactly one CI pin match, got {count}")
          ci_path.write_text(ci.replace(old, new))
          PY
            echo "PATCH_EXIT=$?"

            echo "== install =="
            python -m pip install --upgrade pip
            pip install ruff==0.16.2 mypy==2.3.0 pytest pytest-cov pytest-mock
            pip install -e .
            echo "INSTALL_EXIT=$?"

            echo "== ruff fix =="
            ruff check --fix .
            echo "RUFF_FIX_EXIT=$?"
            ruff format .
            echo "RUFF_FORMAT_EXIT=$?"
            ruff check .
            echo "RUFF_CHECK_EXIT=$?"
            ruff format --check .
            echo "RUFF_FORMAT_CHECK_EXIT=$?"

            echo "== mypy =="
            mypy --version
            mypy src/ --ignore-missing-imports
            echo "MYPY_EXIT=$?"

            echo "== pytest =="
            pytest tests/ -q
            echo "PYTEST_EXIT=$?"

            echo "== manifest =="
            python -m src.server --manifest > manifest.json
            python -c "import json; d=json.load(open('manifest.json')); assert d['server']['name']=='web-check-mcp'; assert len(d['tools'])==8"
            echo "MANIFEST_EXIT=$?"

            echo "== diff check =="
            git diff --check
            echo "DIFF_CHECK_EXIT=$?"
          } > .mypy-probe.log 2>&1

          git restore src/client.py .github/workflows/ci.yml
          rm -f manifest.json
          exit 0

      - name: Commit diagnostic log only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .mypy-probe.log
          git commit -m "ci: capture staged repair diagnostics [skip mypy-probe]"
          git push origin HEAD:style/ruff-format-pass
