name: Apply rate limiter implementation

on:
  push:
    branches:
      - fix/enforce-rate-limiter

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/enforce-rate-limiter
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install exact verification toolchain
        run: python -m pip install -e . pytest ruff==0.16.2 mypy==2.3.0
      - name: Apply asserted implementation
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/apply_rate_limiter.py
          python /tmp/apply_rate_limiter.py
      - name: Format and verify
        run: |
          ruff format src/client.py tests/test_wave4_features.py
          ruff check --fix src/client.py tests/test_wave4_features.py
          ruff check .
          ruff format --check .
          mypy src/ --ignore-missing-imports
          pytest tests/ -q
          python -m src.server --manifest > /tmp/manifest.json
          python -c "import json; d=json.load(open('/tmp/manifest.json')); assert len(d['tools']) == 8"
          git diff --check
      - name: Commit verified permanent files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/client.py tests/test_wave4_features.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix: enforce rate limiting on HTTP attempts'
          git push
