name: One-shot Ruff Format

on:
  push:
    branches:
      - style/ruff-format-pass

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: style/ruff-format-pass
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned Ruff
        run: python -m pip install ruff==0.16.2

      - name: Apply and verify Ruff
        run: |
          ruff check --fix .
          ruff format .
          ruff check .
          ruff format --check .

      - name: Commit mechanical changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Repository was already Ruff-clean"
            exit 0
          fi
          git commit -m "style: apply Ruff 0.16.2 formatting [skip format-once]"
          git push origin HEAD:style/ruff-format-pass
