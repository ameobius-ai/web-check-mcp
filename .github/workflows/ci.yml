name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Lint with ruff
        run: ruff check .

      - name: Compile
        run: python -m py_compile src/client.py src/server.py src/__main__.py src/__init__.py

      - name: Test
        run: python -m pytest tests/ -v

  manifest-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Manifest smoke
        run: |
          python -m src.server --manifest | python -c "import sys,json; d=json.load(sys.stdin); assert d['server']['name']=='web-check-mcp'; assert len(d['tools'])==8; print('manifest OK, tools=',len(d['tools']))"
